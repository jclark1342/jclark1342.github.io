<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | John Clark</title>
    <meta
      name="description"
      content="Contact information and portfolio materials for John Clark."
    >
    <link rel="stylesheet" href="assets/portfolio/gallery.css">
    <style>
      .contact-cover {
        min-height: calc(100vh - 57px);
        padding: clamp(34px, 7vw, 96px) clamp(18px, 4vw, 56px);
      }

      .contact-card {
        display: grid;
        max-width: 1040px;
        min-height: min(620px, calc(100vh - 150px));
        margin: 0 auto;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.55fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #142f3a;
        box-shadow: var(--shadow);
      }

      .contact-copy {
        padding: clamp(28px, 5vw, 58px);
      }

      .contact-copy p {
        color: var(--muted);
        font-size: 1.08rem;
      }

      .contact-methods {
        display: grid;
        gap: 16px;
        margin-top: 32px;
      }

      .contact-methods a {
        display: grid;
        gap: 4px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
      }

      .contact-methods span {
        color: var(--clay);
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .contact-actions {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 12px;
        padding: clamp(28px, 5vw, 58px);
        background:
          linear-gradient(180deg, rgba(242, 132, 69, 0.18), rgba(110, 166, 196, 0.14)),
          #0b1f28;
      }

      .contact-button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 248, 232, 0.62);
        border-radius: 8px;
        color: var(--ink);
        font-weight: 900;
        text-decoration: none;
      }

      .contact-button.primary {
        border-color: var(--clay);
        background: var(--clay);
        color: #102836;
      }

      @media (max-width: 760px) {
        .contact-card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">John Clark <span>Art &amp; Design</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="work.html">Work</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="contact-cover">
      <section class="contact-card" aria-labelledby="contact-title">
        <div class="contact-copy">
          <p class="section-kicker">Contact</p>
          <h1 id="contact-title">Let's talk art and design.</h1>
          <p>
            Reach out for design, fabrication, prototyping, visual, or studio
            opportunities. Portfolio materials are available for review.
          </p>
          <div class="contact-methods" aria-label="Contact methods">
            <a href="mailto:jackjamesclark@gmail.com">
              <span>Email</span>
              <strong>jackjamesclark@gmail.com</strong>
            </a>
            <a href="tel:+19857058668">
              <span>Phone</span>
              <strong>(985) 705-8668</strong>
            </a>
          </div>
        </div>
        <div class="contact-actions">
          <a class="contact-button primary" href="mailto:jackjamesclark@gmail.com">Email</a>
          <a class="contact-button" href="assets/portfolio/docs/portfolio-2026.pdf">Portfolio</a>
          <a class="contact-button" href="assets/portfolio/docs/resume-2026.pdf">Resume</a>
        </div>
      </section>
    </main>
  </body>
</html>
