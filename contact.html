<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | John Clark</title>
    <meta
      name="description"
      content="My contact information and portfolio materials."
    >
    <link rel="stylesheet" href="assets/portfolio/gallery.css">
    <style>
      .contact-cover {
        min-height: calc(100vh - 57px);
        padding: clamp(54px, 9vw, 124px) clamp(24px, 7vw, 112px);
      }

      .contact-card {
        display: grid;
        max-width: 1180px;
        min-height: min(620px, calc(100vh - 150px));
        margin: 0 auto;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 0.55fr);
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .contact-copy {
        padding: 0 clamp(34px, 6vw, 76px) 0 0;
      }

      .contact-copy p {
        color: var(--muted);
        font-size: 0.96rem;
      }

      .contact-methods {
        display: grid;
        gap: 20px;
        margin-top: 42px;
      }

      .contact-methods a {
        display: grid;
        gap: 4px;
        padding-bottom: 0;
        border-bottom: 0;
        text-decoration: none;
      }

      .contact-methods span {
        color: var(--clay);
        font-size: 0.66rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .contact-actions {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 18px;
        padding: 0;
        background: transparent;
      }

      .contact-button {
        display: inline-flex;
        width: fit-content;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-weight: 900;
        padding: 0 18px;
        text-decoration: none;
      }

      .contact-button.primary {
        border-color: var(--clay);
        background: var(--clay);
        color: var(--cream);
      }

      .contact-button:hover,
      .contact-button:focus-visible,
      .contact-methods a:hover strong,
      .contact-methods a:focus-visible strong {
        color: var(--clay);
        text-decoration: underline;
      }

      @media (max-width: 760px) {
        .contact-card {
          grid-template-columns: 1fr;
          gap: 42px;
        }

        .contact-copy {
          padding-right: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">John Clark <span>Art &amp; Design</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main class="contact-cover">
      <section class="contact-card" aria-labelledby="contact-title">
        <div class="contact-copy">
          <p class="section-kicker">Contact</p>
          <h1 id="contact-title">Let's talk art and design.</h1>
          <p>
            Reach out for design, fabrication, prototyping, visual, or studio
            opportunities. Portfolio materials are available for review.
          </p>
          <div class="contact-methods" aria-label="Contact methods">
            <a href="mailto:jackjamesclark@gmail.com">
              <span>Email</span>
              <strong>jackjamesclark@gmail.com</strong>
            </a>
            <a href="tel:+19857058668">
              <span>Phone</span>
              <strong>(985) 705-8668</strong>
            </a>
          </div>
        </div>
        <div class="contact-actions">
          <a class="contact-button primary" href="mailto:jackjamesclark@gmail.com">Email</a>
          <a class="contact-button" href="assets/portfolio/docs/portfolio-2026.pdf">Portfolio</a>
          <a class="contact-button" href="assets/portfolio/docs/resume-2026.pdf">Resume</a>
        </div>
      </section>
    </main>
  </body>
</html>
