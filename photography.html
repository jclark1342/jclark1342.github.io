<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Film Photography | John Clark</title>
    <meta
      name="description"
      content="My black and white film photography, including nighttime waterfront, city, interior, studio, and architectural studies."
    >
    <link rel="stylesheet" href="assets/portfolio/gallery.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">John Clark <span>Art &amp; Design</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="gallery-title">
        <div>
          <p class="section-kicker">Photography</p>
          <h1 id="gallery-title">Film Photo Studies</h1>
        </div>
        <p>
          Black and white film photographs focused on night atmosphere,
          interiors, studio surfaces, city lights, and the way contrast frames
          space.
        </p>
      </section>

      <section class="gallery-section" aria-label="Film photography studies">
        <div class="gallery-shell photo-grid" data-lightbox-gallery data-lightbox-item=".photo-piece">
          <div class="photo-piece is-wide">
            <img
              src="assets/portfolio/images/photography/filmfoto-waterfront-lamps.jpg"
              alt="Black and white film photo of bright waterfront lamps and a night walkway."
            >
          </div>
          <div class="photo-piece is-tall">
            <img
              src="assets/portfolio/images/photo-night-study.jpg"
              alt="Black and white nighttime harbor photograph with a distant illuminated skyline."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-studio-desk.jpg"
              alt="Black and white film photo of a studio desk, lamp, and computer."
            >
          </div>
          <div class="photo-piece is-tall">
            <img
              src="assets/portfolio/images/photography/filmfoto-window-portrait.jpg"
              alt="Black and white film photo of a tall window and silhouetted interior."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-framed-shelf.jpg"
              alt="Black and white film photo of a shelf with a small object and framed image."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-plant-light.jpg"
              alt="Black and white film photo of a plant and high-contrast light."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-desk-screen.jpg"
              alt="Black and white film photo of a desk with a computer screen and work materials."
            >
          </div>
          <div class="photo-piece is-tall">
            <img
              src="assets/portfolio/images/photography/filmfoto-bookshelf.jpg"
              alt="Black and white film photo of a bookshelf and framed wall image."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-room-reflection.jpg"
              alt="Black and white film photo of a blurred room interior with reflective depth."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-kitchen-sink.jpg"
              alt="Black and white film photo of a kitchen sink and windowed interior."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-glass-roof.jpg"
              alt="Black and white film photo of illuminated glass architecture at night."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-city-reflection.jpg"
              alt="Black and white film photo of city lights and reflected architectural forms."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-flared-architecture.jpg"
              alt="Black and white film photo of a bright architectural structure with film flare."
            >
          </div>
          <div class="photo-piece">
            <img
              src="assets/portfolio/images/photography/filmfoto-harbor-dots.jpg"
              alt="Dark black and white film photo with small harbor lights across water."
            >
          </div>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <a href="index.html#work">Work</a>
      <a href="paintings-landscapes.html">Landscape paintings</a>
      <a href="index.html#contact">Contact</a>
    </footer>
    <script src="assets/portfolio/lightbox-gallery.js"></script>
  </body>
</html>
