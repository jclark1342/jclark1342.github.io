<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Figure Drawing Digital Paintings | John Clark</title>
    <meta
      name="description"
      content="My figure drawing digital paintings, exploring gesture, pose, proportion, movement, and wearable-form ideas."
    >
    <link rel="stylesheet" href="assets/portfolio/gallery.css">
  </head>
  <body class="figure-gallery-page">
    <header class="site-header">
      <a class="brand" href="index.html">John Clark <span>Art &amp; Design</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="gallery-title">
        <div>
          <p class="section-kicker">Digital Paintings</p>
          <h1 id="gallery-title">Figure Drawing Studies</h1>
        </div>
        <p>
          Drawing-led figure studies where gesture, pose, movement, and
          proportion become the foundation for wearable-form ideas.
        </p>
      </section>

      <section class="gallery-section" aria-label="Figure drawing digital paintings">
        <div class="gallery-shell figure-grid" data-lightbox-gallery>
          <div class="figure-tile" style="--tile-bg: #fee9e4;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/figure-line-study.jpg" alt="Loose digital figure line drawing on a pale pink background.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/red-construction-figure.jpg" alt="Red construction-line figure drawing with garment geometry.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/walking-construction-figure.jpg" alt="Walking construction figure drawing with loose red and blue lines.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/running-gesture.jpg" alt="Loose running figure gesture drawing.">
          </div>
          <div class="figure-tile" style="--tile-bg: #52112f;">
            <img src="assets/portfolio/images/digital-paintings/figures/sheer-yellow-figure.jpg" alt="Transparent yellow wearable figure painting on a burgundy background.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/leaning-gesture.jpg" alt="Leaning figure gesture sketch.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/studio-figure-drawing.jpg" alt="Standing studio figure drawing beside a simple block form.">
          </div>
          <div class="figure-tile" style="--tile-bg: #122426;">
            <img src="assets/portfolio/images/digital-paintings/figures/sheer-coat-figure.jpg" alt="Transparent coat figure study with pale garment layers.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/motion-figure-drawing.jpg" alt="Two running figure gesture drawings in dark line.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/red-figure.jpg" alt="Standing red figure study with transparent garment marks.">
          </div>
          <div class="figure-tile" style="--tile-bg: #49441c;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/green-ground-figure-drawing.jpg" alt="Figure drawing on an olive green ground.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/pale-figure-study.jpg" alt="Pale figure study with light construction lines.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/drawings/seated-gesture-study.jpg" alt="Seated figure gesture drawing in pale line.">
          </div>
          <div class="figure-tile" style="--tile-bg: #ffffff;">
            <img src="assets/portfolio/images/digital-paintings/figures/walking-figure.jpg" alt="Walking figure study with transparent garment shapes.">

      <div class="figure-lightbox" id="figure-lightbox" aria-hidden="true">
        <button class="figure-lightbox-close" type="button" aria-label="Close full screen image">Close</button>
        <img alt="">
      </div>
    </main>

    <footer class="page-footer">
      <a href="work.html#paintings">Paintings</a>
      <a href="paintings-landscapes.html">Landscapes</a>
      <a href="paintings-fragrance.html">Vessels</a>
      <a href="paintings-objects.html">Drapery</a>
    </footer>

    <script>
      const gallery = document.querySelector("[data-lightbox-gallery]");
      const lightbox = document.querySelector("#figure-lightbox");
      const lightboxImage = lightbox.querySelector("img");
      const closeButton = lightbox.querySelector(".figure-lightbox-close");
      let activeTile = null;

      function openLightbox(image, tile) {
        activeTile = tile;
        lightboxImage.src = image.currentSrc || image.src;
        lightboxImage.alt = image.alt;
        lightbox.setAttribute("aria-hidden", "false");
        lightbox.classList.add("is-open");
        document.body.classList.add("is-lightbox-open");
        closeButton.focus();
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("is-lightbox-open");
        lightboxImage.removeAttribute("src");
        if (activeTile) {
          activeTile.focus();
          activeTile = null;
        }
      }

      gallery.querySelectorAll(".figure-tile").forEach((tile) => {
        const image = tile.querySelector("img");
        tile.setAttribute("role", "button");
        tile.setAttribute("tabindex", "0");
        tile.setAttribute("aria-label", `Open ${image.alt} full screen`);

        tile.addEventListener("click", () => openLightbox(image, tile));
        tile.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openLightbox(image, tile);
          }
        });
      });

      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
          closeLightbox();
        }
      });
    </script>
  </body>
</html>
