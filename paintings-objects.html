<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drapery Digital Paintings | John Clark</title>
    <meta
      name="description"
      content="My drapery digital paintings, exploring translucent fabric, folded volume, silhouette, and soft sculptural form."
    >
    <link rel="stylesheet" href="assets/portfolio/gallery.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">John Clark <span>Art &amp; Design</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#work">Work</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero" aria-labelledby="gallery-title">
        <div>
          <p class="section-kicker">Digital Paintings</p>
          <h1 id="gallery-title">Drapery</h1>
        </div>
        <p>
          Translucent drapery studies focused on folded volume, silhouette,
          soft edges, and fabric as a small sculptural object.
        </p>
      </section>

      <section class="gallery-section" aria-label="Drapery digital paintings">
        <div class="gallery-shell object-grid">
          <div class="object-tile" style="--tile-bg: #c6b5a3;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/amber-low-form.jpg"
              alt="Amber drapery form study on a taupe background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #ded7de;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/faceted-drapery-form.jpg"
              alt="Faceted translucent drapery form study on a pale lavender background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #afafbb;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/lilac-block-drapery-form.jpg"
              alt="Blocky translucent drapery form study on a gray lavender background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #e8e5c6;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/green-cap-drapery-form.jpg"
              alt="Green-capped translucent drapery form study on a pale yellow background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #a2ad8d;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/soft-amber-drapery-form.jpg"
              alt="Soft amber translucent drapery form study on a sage background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #998699;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/tall-lilac-drapery-form.jpg"
              alt="Tall lilac translucent drapery form study on a muted purple background."
            >
          </div>
          <div class="object-tile" style="--tile-bg: #d3f0f4;">
            <img
              src="assets/portfolio/images/digital-paintings/object-studies/brown-drapery-form.jpg"
              alt="Brown translucent drapery form study on a pale blue background."
            >
          </div>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <a href="work.html#paintings">Paintings</a>
      <a href="paintings-landscapes.html">Landscapes</a>
      <a href="paintings-fragrance.html">Vessels</a>
      <a href="paintings-figures.html">Figures</a>
